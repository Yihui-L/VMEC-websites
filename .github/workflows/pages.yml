name: Publish VMEC websites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package manual and example
        env:
          SITE_DIR: ${{ runner.temp }}/vmec-pages
        run: |
          mkdir "$SITE_DIR"
          git archive HEAD -- .nojekyll README.md \
            Source-Code/index.html Source-Code/styles.css \
            Source-Code/README.md Source-Code/SOURCE_VERSION.md \
            VMEC-lyh-example | tar -xf - -C "$SITE_DIR"

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/vmec-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
